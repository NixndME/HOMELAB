apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-app
  namespace: uptime
  labels:
    app: uptime
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime
  template:
    metadata:
      labels:
        app: uptime
    spec:
      restartPolicy: Always
      containers:
      - name: uptime
        image: louislam/uptime-kuma:1.23.17
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
          protocol: TCP
        resources:
          requests:
            cpu: "200m"
            memory: "150Mi"
          limits:
            cpu: "300m"
            memory: "250Mi"
        # tcpSocket, not httpGet: same lesson as Trilium - avoid any risk
        # of a probe interacting with the app's own request handling.
        readinessProbe:
          tcpSocket:
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 5
        livenessProbe:
          tcpSocket:
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 5
        volumeMounts:
        - name: uptime-vol
          mountPath: /app/data
      volumes:
      - name: uptime-vol
        persistentVolumeClaim:
          claimName: uptime-pvc
