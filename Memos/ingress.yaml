# No Traefik BasicAuth layer here: memos' own Bearer-token API auth and
# Traefik's BasicAuth both need the single Authorization header, so
# stacking them breaks every authenticated call after login. Relying
# solely on memos' own built-in login (hashed passwords, real sessions).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memos-ingress
  namespace: memos
  labels:
    app.kubernetes.io/name: memos
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: memos.init0xff.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: memos-svc
            port:
              number: 5230
