# NOTE: the `memos-auth` Secret referenced by the Middleware below is
# deliberately NOT defined here. It's applied directly to the cluster
# (kubectl) and never committed to git.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-auth
  namespace: memos
  labels:
    app.kubernetes.io/name: memos
spec:
  basicAuth:
    secret: memos-auth
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memos-ingress
  namespace: memos
  labels:
    app.kubernetes.io/name: memos
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: memos-dashboard-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: memos.init0xff.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: memos-svc
            port:
              number: 5230
