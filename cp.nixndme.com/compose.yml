# cp: self-hosted clipboard for text, files and links that expire.
# Runs as its own compose project with hard resource limits, so it can sit next to other
# stacks (e.g. on the Pi) without affecting them. All site values come from .env.
# The image is only ever pulled from Docker Hub (see README "Release"); nothing is built here.
name: cp
services:
  cp:
    image: ${CP_IMAGE:-nixndme/cp:latest}
    pull_policy: missing
    container_name: cp
    restart: always                 # back up by itself after a power cut
    user: "${CP_UID:-65532}:${CP_GID:-65532}"
    env_file: .env
    environment:
      GOMEMLIMIT: 160MiB            # make the Go GC work harder well before the 256m cap
    ports:
      - "127.0.0.1:${CP_PORT:-8090}:8080"   # loopback only: the tunnel is the only way in
    volumes:
      - ${CP_DATA_PATH:-./data}:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Dedicated Cloudflare Tunnel for cp only, so other stacks' tunnels are never touched.
  # Enabled with COMPOSE_PROFILES=tunnel in .env; config.yml + credentials live in ./tunnel.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    container_name: cp-tunnel
    restart: always
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ${CP_TUNNEL_DIR:-./tunnel}:/etc/cloudflared:ro
    depends_on: [cp]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
