# cp: self-hosted clipboard for text, files and links that expire.
# Runs as its own compose project with hard resource limits, so it can sit next to other
# stacks (e.g. on the Pi) without affecting them. All site values come from .env.
# The image is only ever pulled from Docker Hub (see README "Release"); nothing is built here.
name: cp
services:
  cp:
    image: ${CP_IMAGE:-nixndme/cp:latest}
    pull_policy: missing
    container_name: cp
    restart: always                 # back up by itself after a power cut
    user: "${CP_UID:-65532}:${CP_GID:-65532}"
    env_file: .env
    environment:
      GOMEMLIMIT: 160MiB            # make the Go GC work harder well before the 256m cap
    ports:
      - "127.0.0.1:${CP_PORT:-8090}:8080"   # loopback only: the tunnel is the only way in
    volumes:
      - ${CP_DATA_PATH:-./data}:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Dedicated Cloudflare Tunnel for cp only, so other stacks' tunnels are never touched.
  # Enabled with COMPOSE_PROFILES=tunnel in .env; config.yml + credentials live in ./tunnel.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    container_name: cp-tunnel
    restart: always
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ${CP_TUNNEL_DIR:-./tunnel}:/etc/cloudflared:ro
    depends_on: [cp]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Relay for Live transfer (coturn), used only when two devices cannot connect directly, e.g.
  # because a laptop firewall drops incoming traffic. Each browser then connects OUT to the relay,
  # which forwards the still end-to-end encrypted (DTLS) data; nothing is stored.
  # Home network only: it listens on the Pi's LAN address and relays only to LAN addresses.
  # Logins are short-lived and signed by cp with CP_LIVE_TURN_SECRET; nobody else can use it.
  # Enabled with COMPOSE_PROFILES=tunnel,turn in .env (see README "Relay").
  turn:
    image: coturn/coturn:4.7.0-alpine
    profiles: [turn]
    container_name: cp-turn
    restart: always
    network_mode: host              # relay ports must be the Pi's own LAN ports
    environment:
      TURN_SECRET: ${CP_LIVE_TURN_SECRET:-}
      TURN_IP: ${CP_TURN_LISTEN_IP:-}
    # Refuse to start half-configured: an empty secret would let anyone forge relay logins.
    # (Checked here, not with ${VAR:?}, so stacks without the turn profile still run.)
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ "$${#TURN_SECRET}" -lt 32 ] || [ -z "$$TURN_IP" ]; then
          echo "cp-turn: set CP_LIVE_TURN_SECRET (32+ letters/digits) and CP_TURN_LISTEN_IP in .env" >&2
          exit 1
        fi
        # After a power cut Docker can start this before the LAN address is up; coturn would
        # then run without its sockets, so wait for the address first.
        until ip -4 -o addr show | grep -q " inet $$TURN_IP/"; do
          echo "cp-turn: waiting for $$TURN_IP to come up" >&2
          sleep 2
        done
        exec docker-entrypoint.sh "$$@"
      - cp-turn
    command:
      # $$VAR: expanded inside the container by the image's entrypoint, so the secret is not
      # written into the compose command line.
      - --listening-ip=$$TURN_IP
      - --relay-ip=$$TURN_IP
      - --listening-port=${CP_TURN_PORT:-3478}
      - --min-port=${CP_TURN_MIN_PORT:-49160}
      - --max-port=${CP_TURN_MAX_PORT:-49200}
      - --realm=cp
      - --use-auth-secret
      - --static-auth-secret=$$TURN_SECRET
      - --denied-peer-ip=0.0.0.0-255.255.255.255
      - --allowed-peer-ip=${CP_TURN_ALLOWED_PEERS:-192.168.0.0-192.168.255.255}
      - --no-multicast-peers
      - --no-tcp-relay
      - --no-tls
      - --no-dtls
      - --no-cli
      - --fingerprint
      - --user-quota=8
      - --total-quota=32
      - --stale-nonce=600
      - --pidfile=/tmp/turnserver.pid
      - --log-file=stdout
      - --simple-log
    read_only: true
    tmpfs: [/tmp, /var/lib/coturn]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]     # the image's turnserver binary carries this file capability
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
